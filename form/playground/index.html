<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>表单设计器 · 开发预览</title>
  <style>
    body { margin: 0; background: var(--xh-bg-page); color: var(--xh-fg-default); }
    .page { display: grid; gap: var(--xh-space-4); max-inline-size: 80rem; margin-inline: auto; padding: var(--xh-space-4); }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--xh-space-3); }
    .switch-label { display: inline-flex; align-items: center; gap: var(--xh-space-2); color: var(--xh-fg-muted); font-size: var(--xh-font-size-sm); }
    .columns { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: var(--xh-space-4); align-items: start; }
    .panel { display: grid; gap: var(--xh-space-3); }
    .output { margin: 0; min-block-size: 6rem; max-block-size: 24rem; overflow: auto; padding: var(--xh-space-2); border: var(--xh-stroke-thin) solid var(--xh-border-subtle); border-radius: var(--xh-radius-md); color: var(--xh-fg-muted); font-family: var(--xh-font-family-mono); font-size: var(--xh-font-size-xs); white-space: pre-wrap; }
    @media (max-width: 64rem) { .columns { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>
  <main class="page">
    <xh-alert tone="warning">
      <div data-xh-part="root">
        <div data-xh-part="content">
          <div data-xh-part="title">这是开发预览，不是产品</div>
          <div data-xh-part="description">只用来查看表单渲染器的当前进度。界面与接口都还会变，数据不会保存。</div>
        </div>
      </div>
    </xh-alert>

    <div class="bar">
      <xh-toolbar>
        <div data-xh-part="root" aria-label="表单操作">
          <div data-xh-part="group">
            <button data-xh-part="item" type="button" value="submit">提交</button>
            <button data-xh-part="item" type="button" value="validate">校验</button>
            <button data-xh-part="item" type="button" value="reset">重置</button>
            <button data-xh-part="item" type="button" value="fill">填入示例数据</button>
          </div>
        </div>
      </xh-toolbar>
      <span class="switch-label">
        <xh-switch id="readonly">
          <button data-xh-part="root" aria-label="整表只读">
            <span data-xh-part="thumb"></span>
          </button>
        </xh-switch>
        只读
      </span>
      <span class="switch-label">
        <xh-switch id="disabled">
          <button data-xh-part="root" aria-label="整表禁用">
            <span data-xh-part="thumb"></span>
          </button>
        </xh-switch>
        禁用
      </span>
      <span class="switch-label">
        <xh-switch id="zh" default-checked>
          <button data-xh-part="root" aria-label="中文语言包">
            <span data-xh-part="thumb"></span>
          </button>
        </xh-switch>
        中文语言包 formZhCN
      </span>
    </div>

    <div class="columns">
      <xh-form-renderer id="renderer"></xh-form-renderer>
      <div class="panel">
        <pre class="output" id="data" aria-label="表单数据"></pre>
        <pre class="output" id="log" aria-label="事件日志" aria-live="polite"></pre>
      </div>
    </div>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
